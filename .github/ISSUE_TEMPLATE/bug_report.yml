name: 🐞 Bug report
description: Report a problem installing, upgrading or removing District AI through this tap.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you start, please [search existing issues](https://github.com/distronode-corporation/homebrew-tap/issues?q=is%3Aissue):** it may already be reported or fixed.

        **A bug in the app itself** (it crashes, a screen is wrong, a call fails) goes to [district-macos's issues](https://github.com/distronode-corporation/district-macos/issues), not here. This tracker is for the cask: installing, upgrading and removing the app with Homebrew.

        ⛔ **Do not report a security vulnerability here.** Report it privately through [Report a vulnerability](https://github.com/distronode-corporation/homebrew-tap/security/advisories/new) instead; see [SECURITY.md](https://github.com/distronode-corporation/homebrew-tap/blob/main/.github/SECURITY.md).

        ⚠️ **Nothing you paste here is private.** `brew config` and command output can show your user name and paths. Redact anything you would not publish, and never paste a token.
  - type: checkboxes
    id: prechecks
    attributes:
      label: Before submitting
      options:
        - label: I've searched existing issues and this isn't a duplicate.
          required: true
        - label: This is a problem with the cask, not with the app itself.
          required: true
        - label: This is not a security issue (those go to the private report linked above).
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What's the problem?
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: dropdown
    id: updated
    attributes:
      label: Did you run `brew update` first?
      description: An out-of-date Homebrew or tap is the most common cause. Please run `brew update` and try again before reporting.
      options:
        - Yes, and the problem is still there
        - "No"
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: The failing command
      placeholder: brew install --cask distronode-corporation/tap/district-ai
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full output of the failing command
      description: The whole output, not just the last line. Add `--verbose` if you can.
      render: text
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 15.6, Apple silicon (M2)
    validations:
      required: true
  - type: textarea
    id: brew-config
    attributes:
      label: Output of `brew config`
      render: text
    validations:
      required: true
