# No blank issues: everything goes through the structured bug report form, or one of
# the links below. The tracker is for problems installing, upgrading or removing the
# cask; bugs in the app itself go to district-macos (see .github/SUPPORT.md).
blank_issues_enabled: false
contact_links:
  - name: README
    url: https://github.com/distronode-corporation/homebrew-tap#readme
    about: How to install from the tap, how updates work, and what the tap holds today.
  - name: Questions and ideas
    url: https://github.com/distronode-corporation/homebrew-tap/discussions
    about: Ask a question or suggest an idea in Discussions.
  - name: A bug in the app itself
    url: https://github.com/distronode-corporation/district-macos/issues
    about: The app's source and releases live in district-macos. Report app bugs there.
  - name: Security report
    url: https://github.com/distronode-corporation/homebrew-tap/security/advisories/new
    about: Please do not open a public issue for a vulnerability. Report it privately here (see SECURITY.md).
