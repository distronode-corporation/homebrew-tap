name: Audit

# Every check this tap has, on every push to main and every pull request, and once a
# week so that a check whose answer changes without a push (a new Homebrew audit rule,
# a release URL that stopped resolving) still reports:
#
# - `brew`: `brew style` and `brew audit` over every cask in Casks/. With no cask yet
#   it still sets Homebrew up and taps this repository, so the plumbing is proven
#   before the first cask needs it, and then says there is nothing to check.
# - `zizmor`: static analysis of these workflows.
# - `gitleaks`: secrets anywhere in the history, not just the tip.
# - `hygiene`: the org's repository rules (no em or en dashes) and the shape of Casks/.
#
# Everything is on ubuntu-24.04. macOS runner minutes are billed at ten times the
# Linux rate while the repository is private, and nothing here needs a Mac: Homebrew
# on Linux styles and audits casks.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday, 30 minutes after scorecard.yml's '17 6 * * 1' so the two weekly
    # runs do not queue against each other.
    - cron: '47 6 * * 1'
  workflow_dispatch:

# Least privilege at the top level, so a job added later starts read-only instead of
# inheriting the repository's default token scope. Nothing here writes.
permissions:
  contents: read

# Per ref, and only pull requests cancel in flight: a superseded pull request run is
# waste, a superseded main run is history.
concurrency:
  group: audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  brew:
    name: brew style and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAP: distronode-corporation/tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Homebrew's own setup-homebrew action is not on the organization's allowed
      # actions list, so this does what it does for a tap by hand, with the Homebrew
      # the ubuntu-24.04 image already carries (installed, not on PATH): update it to
      # the current release, so the audit rules are today's, then link this checkout
      # in as the tap. Homebrew loads a non-official tap's casks only once the tap is
      # trusted, which `brew audit` needs.
      - name: Set up Homebrew and tap this checkout
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew update --quiet
          brew --version
          tap_dir="$(brew --repository)/Library/Taps/distronode-corporation/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"
          brew trust --tap "$TAP"
          # Proves Homebrew sees this checkout as the tap before anything is judged,
          # so an empty run below means "no casks", not "no tap".
          brew tap-info "$TAP"

      - name: brew style and brew audit
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          shopt -s nullglob
          casks=(Casks/*.rb)
          if (( ${#casks[@]} == 0 )); then
            echo "No casks under Casks/, so there is nothing to style or audit."
            exit 0
          fi
          printf 'Cask: %s\n' "${casks[@]}"
          brew style "$TAP"
          # `--os all --arch all` is load-bearing. On Linux a plain `--tap` audit
          # skips a cask that depends on macOS and exits 0 having checked nothing
          # (measured with Homebrew 7.0.7: a cask planted with two audit errors
          # passed without it and failed with it).
          brew audit --strict --os all --arch all --tap "$TAP"

  # Static analysis of these workflows: template injection, over-broad token
  # permissions, credential persistence, cache poisoning, unpinned actions.
  # Suppressions are inline `# zizmor: ignore[...]` comments with a reason.
  #
  # Annotations mode, not SARIF: uploading SARIF to code scanning needs GitHub Code
  # Security on a private repository, so here zizmor reports as annotations and FAILS
  # the job on a finding, on pushes and pull requests alike.
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history, not just the tip

      # gitleaks/gitleaks-action needs a paid GITLEAKS_LICENSE for an organization
      # repository. The CLI itself is free (MIT), so install a pinned version and run
      # it, as district-ios does. `go install` of a tagged module is checked against
      # the Go checksum database.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: false

      # `--log-opts="HEAD"`: the history reachable from this checkout only. A
      # full-depth checkout also fetches every other branch, and without it one open
      # pull request's finding reds every other pull request's run. A push to main
      # still scans all of main.
      - name: gitleaks git
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --no-banner --redact -v --log-opts="HEAD" .

  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pattern is the UTF-8 bytes of U+2013 and U+2014, written as escapes so
      # this file passes its own check. It is first run against a planted control,
      # so a pattern that has stopped matching fails loudly instead of passing
      # quietly.
      - name: No em or en dashes
        run: |
          set -euo pipefail
          export LC_ALL=C
          pattern='\xe2\x80[\x93\x94]'
          printf 'en \xe2\x80\x93 and em \xe2\x80\x94\n' > "$RUNNER_TEMP/dash-control.txt"
          # From outside the checkout: `--no-index` refuses a path outside the
          # repository it runs in.
          if ! (cd "$RUNNER_TEMP" && git grep --no-index -qP "$pattern" -- dash-control.txt); then
            echo "::error::The dash pattern no longer matches its planted control."
            exit 1
          fi
          set +e
          git grep -nIP "$pattern"
          status=$?
          set -e
          case "$status" in
            0) echo "::error::Em or en dashes above. Use commas, periods or parentheses."; exit 1 ;;
            1) echo "No em or en dashes in any tracked file." ;;
            *) echo "::error::git grep failed with status $status."; exit "$status" ;;
          esac

      # A tap holds recipes, not binaries: Casks/ carries only `.rb` files (and the
      # `.gitkeep` that keeps it in git while it is empty).
      - name: Casks/ holds only casks
        run: |
          set -euo pipefail
          stray="$(git ls-files Casks | grep -v -E '^Casks/([A-Za-z0-9@._+-]+\.rb|\.gitkeep)$' || true)"
          if [[ -n "$stray" ]]; then
            while IFS= read -r path; do
              echo "::error::Not a cask: $path"
            done <<< "$stray"
            exit 1
          fi
          echo "Casks/ holds only casks."
