name: Audit

# Every check this tap has, on every push to main and every pull request, and once a
# week so that a check whose answer changes without a push (a new Homebrew audit rule,
# a release URL that stopped resolving) still reports:
#
# - `brew`: `brew style` and `brew audit` over every cask in Casks/. With no cask yet
#   it still sets Homebrew up and taps this repository, so the plumbing is proven
#   before the first cask needs it, and then says there is nothing to check.
# - `macos`: what only a Mac can check, for every cask: the online audit with the
#   download (Homebrew 7 removed `--signing`; codesign and spctl check the
#   installed app below), livecheck against the app's
#   update feed, a real install, the app launching, and `uninstall --zap`. With no
#   cask it says so and succeeds.
# - `zizmor`: static analysis of these workflows.
# - `gitleaks`: secrets anywhere in the history, not just the tip.
# - `hygiene`: the org's repository rules (no em or en dashes) and the shape of Casks/.
#
# Everything but `macos` is on ubuntu-24.04: Homebrew on Linux styles and audits casks.
# The repository is public, so the macOS job costs no minutes.
#
# bump.yml dispatches this workflow on its bump branch, because a pull request it
# opens with GITHUB_TOKEN triggers nothing; the jobs then report on that branch's
# commit, which is where the pull request's required checks look.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday, 30 minutes after scorecard.yml's '17 6 * * 1' so the two weekly
    # runs do not queue against each other.
    - cron: '47 6 * * 1'
  workflow_dispatch:

# Least privilege at the top level, so a job added later starts read-only instead of
# inheriting the repository's default token scope. Nothing here writes.
permissions:
  contents: read

# Per ref, and only pull requests cancel in flight: a superseded pull request run is
# waste, a superseded main run is history.
concurrency:
  group: audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  brew:
    name: brew style and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAP: distronode-corporation/tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Homebrew's own setup-homebrew action is not on the organization's allowed
      # actions list, so this does what it does for a tap by hand, with the Homebrew
      # the ubuntu-24.04 image already carries (installed, not on PATH): update it to
      # the current release, so the audit rules are today's, then link this checkout
      # in as the tap. Homebrew loads a non-official tap's casks only once the tap is
      # trusted, which `brew audit` needs.
      - name: Set up Homebrew and tap this checkout
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew update --quiet
          brew --version
          tap_dir="$(brew --repository)/Library/Taps/distronode-corporation/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"
          brew trust --tap "$TAP"
          # Proves Homebrew sees this checkout as the tap before anything is judged,
          # so an empty run below means "no casks", not "no tap".
          brew tap-info "$TAP"

      - name: brew style and brew audit
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          shopt -s nullglob
          casks=(Casks/*.rb)
          if (( ${#casks[@]} == 0 )); then
            echo "No casks under Casks/, so there is nothing to style or audit."
            exit 0
          fi
          printf 'Cask: %s\n' "${casks[@]}"
          brew style "$TAP"
          # `--os all --arch all` is load-bearing. On Linux a plain `--tap` audit
          # skips a cask that depends on macOS and exits 0 having checked nothing
          # (measured with Homebrew 7.0.7: a cask planted with two audit errors
          # passed without it and failed with it).
          brew audit --strict --os all --arch all --tap "$TAP"

  # Static analysis of these workflows: template injection, over-broad token
  # permissions, credential persistence, cache poisoning, unpinned actions.
  # Suppressions are inline `# zizmor: ignore[...]` comments with a reason.
  #
  # Annotations mode, not SARIF: uploading SARIF to code scanning needs GitHub Code
  # Security on a private repository, so here zizmor reports as annotations and FAILS
  # the job on a finding, on pushes and pull requests alike.
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history, not just the tip

      # gitleaks/gitleaks-action needs a paid GITLEAKS_LICENSE for an organization
      # repository. The CLI itself is free (MIT), so install a pinned version and run
      # it, as district-ios does. `go install` of a tagged module is checked against
      # the Go checksum database.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: false

      # `--log-opts="HEAD"`: the history reachable from this checkout only. A
      # full-depth checkout also fetches every other branch, and without it one open
      # pull request's finding reds every other pull request's run. A push to main
      # still scans all of main.
      - name: gitleaks git
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --no-banner --redact -v --log-opts="HEAD" .

  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pattern is the UTF-8 bytes of U+2013 and U+2014, written as escapes so
      # this file passes its own check. It is first run against a planted control,
      # so a pattern that has stopped matching fails loudly instead of passing
      # quietly.
      - name: No em or en dashes
        run: |
          set -euo pipefail
          export LC_ALL=C
          pattern='\xe2\x80[\x93\x94]'
          printf 'en \xe2\x80\x93 and em \xe2\x80\x94\n' > "$RUNNER_TEMP/dash-control.txt"
          # From outside the checkout: `--no-index` refuses a path outside the
          # repository it runs in.
          if ! (cd "$RUNNER_TEMP" && git grep --no-index -qP "$pattern" -- dash-control.txt); then
            echo "::error::The dash pattern no longer matches its planted control."
            exit 1
          fi
          set +e
          git grep -nIP "$pattern"
          status=$?
          set -e
          case "$status" in
            0) echo "::error::Em or en dashes above. Use commas, periods or parentheses."; exit 1 ;;
            1) echo "No em or en dashes in any tracked file." ;;
            *) echo "::error::git grep failed with status $status."; exit "$status" ;;
          esac

      # A tap holds recipes, not binaries: Casks/ carries only `.rb` files (and the
      # `.gitkeep` that keeps it in git while it is empty).
      - name: Casks/ holds only casks
        run: |
          set -euo pipefail
          stray="$(git ls-files Casks | grep -v -E '^Casks/([A-Za-z0-9@._+-]+\.rb|\.gitkeep)$' || true)"
          if [[ -n "$stray" ]]; then
            while IFS= read -r path; do
              echo "::error::Not a cask: $path"
            done <<< "$stray"
            exit 1
          fi
          echo "Casks/ holds only casks."

  macos:
    name: macOS install and zap
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TAP: distronode-corporation/tap
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      # The online audit and livecheck call the GitHub API; unauthenticated, a shared
      # macOS runner IP has 60 requests an hour and the first cask's audit hit it.
      # The job's own read-only token raises that; no personal token is involved.
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Casks
        id: casks
        run: |
          set -euo pipefail
          shopt -s nullglob
          casks=(Casks/*.rb)
          if (( ${#casks[@]} == 0 )); then
            echo "No casks under Casks/, so there is nothing to install."
            echo "names=" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          names="$(for c in "${casks[@]}"; do basename "$c" .rb; done | tr '\n' ' ')"
          echo "Casks: $names"
          echo "names=$names" >>"$GITHUB_OUTPUT"

      # The image's Homebrew, updated to the current release, with this checkout linked
      # in as the tap, as in the `brew` job.
      - name: Set up Homebrew and tap this checkout
        if: steps.casks.outputs.names != ''
        run: |
          set -euo pipefail
          brew update --quiet
          brew --version
          tap_dir="$(brew --repository)/Library/Taps/distronode-corporation/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"
          brew trust --tap "$TAP"
          brew tap-info "$TAP"

      - name: Audit online
        if: steps.casks.outputs.names != ''
        env:
          NAMES: ${{ steps.casks.outputs.names }}
        run: |
          set -euo pipefail
          for name in $NAMES; do
            brew audit --strict --online --cask "$TAP/$name"
          done

      # A cask whose livecheck cannot read its feed reports an error here; one that is
      # merely behind the feed is a warning (bump.yml proposes the newer version).
      - name: livecheck
        if: steps.casks.outputs.names != ''
        env:
          NAMES: ${{ steps.casks.outputs.names }}
        run: |
          set -euo pipefail
          for name in $NAMES; do
            result="$(brew livecheck --cask --json "$TAP/$name")"
            echo "$result"
            if jq -e '.[0] | has("error")' <<<"$result" >/dev/null; then
              echo "::error::livecheck could not read $name's feed."
              exit 1
            fi
            current="$(jq -r '.[0].version.current' <<<"$result")"
            latest="$(jq -r '.[0].version.latest' <<<"$result")"
            if [ "$current" != "$latest" ]; then
              echo "::warning::$name is $current in the cask; its feed offers $latest."
            fi
          done

      # Install, launch each app the cask installs (in the background), quit it the
      # way the cask's `uninstall quit:` does, then remove everything with --zap and
      # check the apps are gone.
      - name: Install, launch and zap
        if: steps.casks.outputs.names != ''
        env:
          NAMES: ${{ steps.casks.outputs.names }}
        run: |
          set -euo pipefail
          for name in $NAMES; do
            brew install --cask "$TAP/$name"
            info="$(brew info --cask --json=v2 "$TAP/$name")"
            # macOS ships bash 3.2, which has no mapfile.
            apps=()
            while IFS= read -r line; do apps+=("$line"); done < <(jq -r '.casks[0].artifacts[] | select(has("app")) | .app[] | strings' <<<"$info")
            ids=()
            while IFS= read -r line; do ids+=("$line"); done < <(jq -r '.casks[0].artifacts[] | select(has("uninstall")) | .uninstall[] | .quit // empty | if type == "array" then .[] else . end' <<<"$info")
            (( ${#apps[@]} > 0 )) || { echo "::error::$name installs no app."; exit 1; }
            for app in "${apps[@]}"; do
              path="/Applications/$app"
              [ -d "$path" ] || { echo "::error::$name did not install $path."; exit 1; }
              codesign --verify --deep --strict "$path"
              spctl --assess --type execute -vv "$path"
              executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$path/Contents/Info.plist")"
              open -g "$path"
              for _ in $(seq 1 30); do
                pgrep -x "$executable" >/dev/null && break
                sleep 1
              done
              pgrep -x "$executable" >/dev/null || { echo "::error::$app did not start."; exit 1; }
              sleep 5
              pgrep -x "$executable" >/dev/null || { echo "::error::$app started, then exited within 5 seconds."; exit 1; }
              echo "$app is running"
            done
            for id in ${ids[@]+"${ids[@]}"}; do
              osascript -e "tell application id \"$id\" to quit" || true
            done
            brew uninstall --cask --zap "$TAP/$name"
            for app in "${apps[@]}"; do
              [ ! -e "/Applications/$app" ] || { echo "::error::/Applications/$app is still there after uninstall --zap."; exit 1; }
            done
            echo "$name: installed, launched, quit and zapped"
          done
