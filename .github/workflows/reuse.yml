name: REUSE

# Every file states its copyright and licence: source files in an SPDX comment header,
# files that cannot carry a comment in REUSE.toml. `reuse lint` fails this check when a
# file has neither (https://reuse.software). To fix a failure, add the header with
# `reuse annotate --license BSD-2-Clause --copyright "Distronode Corporation" --exclude-year <file>`,
# or a REUSE.toml entry for a file that cannot take a comment.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reuse-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reuse:
    name: reuse lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
