# REUSE metadata (https://reuse.software) for files that cannot carry a comment header:
# documentation, images and the empty placeholder that keeps Casks/ in git. Every other
# file carries its own SPDX header, and `reuse lint` in CI fails when one is missing.
version = 1

[[annotations]]
path = ["**/*.md", "**/*.png", "Casks/.gitkeep"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Distronode Corporation"
SPDX-License-Identifier = "BSD-2-Clause"
